name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-shard:
    # The Python suite, split across parallel runners by recorded per-file
    # duration (``tests/sharding.py``, ``tests/shard_durations.json``), with
    # xdist (``-n auto --dist=loadfile`` from pyproject) inside each shard.
    # The ``test (3.14)`` job below merges coverage and enforces the gates;
    # it is the one check to require.
    name: test shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exactly the locked set)
        # ``--locked`` fails instead of re-resolving when uv.lock is out
        # of date, so CI always tests the set the images ship.
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run this shard with branch coverage
        # Coverage data only (``--cov-report=``) — the gate runs on the
        # merged data in ``test (3.14)``; a single shard covers a fraction
        # of the code. ``coverage`` is ``parallel = true`` so the xdist
        # workers' files merge into ``.coverage`` when pytest-cov finalises.
        #
        # ``--durations=25`` prints the shard's slowest tests every run, so
        # a new test that waits out a real timeout shows up in review (see
        # docs/testing.md, "Keeping the suite fast").
        #
        # ``--security-manifest`` records the outcome of every
        # ``security``-marked test this shard ran (the §27 release
        # blockers); ``test (3.14)`` checks the union. A skipped or
        # xfailed one already fails the shard (``tests/security_guard.py``).
        #
        # ``--store-shard-durations`` feeds the merged
        # ``shard-durations`` artifact used to rebalance the split.
        run: |
          pytest --shard=${{ matrix.shard }}/6 \
            --cov=socialhome --cov-branch --cov-report= \
            --tb=short -q --durations=25 \
            --security-manifest=shard-out/security-manifest/shard-${{ matrix.shard }}.json \
            --store-shard-durations=shard-out/durations/shard-${{ matrix.shard }}.json
          mkdir -p shard-out/coverage
          mv .coverage shard-out/coverage/.coverage.shard-${{ matrix.shard }}

      - uses: actions/upload-artifact@v7
        with:
          name: test-shard-${{ matrix.shard }}
          path: shard-out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test:
    # Keeps the historical check name. Fails if any shard failed or was
    # cancelled, then enforces the gates on the shards' combined results.
    name: test (3.14)
    needs: test-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        if: ${{ needs.test-shard.result != 'success' }}
        run: |
          echo "test-shard result: ${{ needs.test-shard.result }}"
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exactly the locked set)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          pattern: test-shard-*
          path: shard-out
          merge-multiple: true

      - name: Branch coverage gate on the merged shards
        # §27.5 — ``[tool.coverage.report] fail_under = 90``; default
        # precision 0, so the displayed rounded percent is what the gate
        # compares. Ratchet it upward as more modules get covered; never
        # lower it — add missing tests instead. A missing shard's data
        # shows up here as a coverage drop.
        run: |
          ls -a shard-out/coverage
          coverage combine shard-out/coverage
          coverage report --skip-covered --sort=cover
          coverage report --format=total

      - name: Release blockers all ran and passed
        # Collect the whole tree and fail unless every collected
        # ``security`` test is ``passed`` in the union of the shards'
        # manifests — a deselected, skipped or never-run release blocker,
        # or a shard that never ran, fails here. Replaces re-running
        # ``pytest tests/protocol/ -m security`` (~3 100 tests, ~7 min).
        run: |
          pytest --collect-only -qq -n 0 --security-verify=shard-out/security-manifest

      - name: Merged per-file durations (to rebalance the shards)
        run: |
          python - <<'PY'
          import json, pathlib
          merged = {}
          for p in sorted(pathlib.Path("shard-out/durations").glob("*.json")):
              data = json.loads(p.read_text())
              print(f"{p.stem}: {sum(data.values()):.0f} s of test time in {len(data)} files")
              merged.update(data)
          out = pathlib.Path("shard-durations/shard_durations.json")
          out.parent.mkdir()
          out.write_text(json.dumps(dict(sorted(merged.items())), indent=1) + "\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: shard-durations
          path: shard-durations
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Pinned, NOT ``pip install ruff``. ruff's default rule set grows
      # between minors, so an unpinned install silently re-lints the
      # whole tree against whatever released most recently: 0.16 turned
      # a green ``main`` into 2779 findings and failed every open PR
      # without a line of code changing. ``.pre-commit-config.yaml``'s
      # ``ruff-pre-commit`` rev is the source of truth — keep this, that
      # rev, and pyproject's ``[dev]`` ``ruff==`` pin in lockstep.
      - run: pip install ruff==0.17.1
      - name: ruff check
        run: ruff check socialhome/ tests/
      - name: ruff format
        run: ruff format --check socialhome/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (exactly the locked set)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: mypy
        run: mypy socialhome/

  lock:
    # uv.lock and the exported requirements/constraints*.txt must match
    # pyproject.toml — the Docker images and the Home Assistant App install
    # from the exports, so a stale export would ship a set CI never tested.
    # Fix a failure with ``scripts/lock.sh`` (docs/testing.md, "Dependency
    # lock").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - name: uv.lock + constraints exports are up to date
        run: scripts/lock.sh --check

  images:
    # Install the locked set exactly the way each shipped image does, on
    # both arches we ship: ``Dockerfile.sh`` / ``Dockerfile.gfs`` (Debian,
    # glibc) and the Home Assistant App's builder stage (Alpine, musl).
    # ``--require-hashes`` fails if the lock has no file (or no hash) for a
    # platform, so a lock bump that drops e.g. a musllinux/aarch64 wheel
    # fails here, not at release time. The release itself builds the real
    # images in publish.yml; the App's own CI builds against released tags.
    name: images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - name: Build the wheel
        # No SPA bundle — only the dependency install is under test here.
        # A fixed version keeps hatch-vcs off the shallow clone's history.
        id: wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          uv build --wheel --out-dir dist
          echo "name=$(basename dist/socialhome-*.whl)" >> "$GITHUB_OUTPUT"
      - name: Core image (Dockerfile.sh)
        run: |
          docker build -f Dockerfile.sh --build-arg WHEEL=${{ steps.wheel.outputs.name }} -t sh-core .
          docker run --rm sh-core python -c "import socialhome.app, aiolibdatachannel, PIL, av"
      - name: GFS image (Dockerfile.gfs)
        run: |
          docker build -f Dockerfile.gfs --build-arg WHEEL=${{ steps.wheel.outputs.name }} -t sh-gfs .
          docker run --rm sh-gfs python -c "import socialhome.global_server, bcrypt, qrcode"
      - name: Home Assistant App builder (Alpine / musl)
        # Mirrors the builder stage of social-home-io/ha-app's Dockerfiles:
        # same base image, same toolchain, same ``pip3 wheel
        # --require-hashes -r requirements/constraints.txt``.
        run: |
          docker run --rm -v "$PWD/requirements:/req:ro" \
            ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.14-alpine3.23 \
            sh -euc 'apk add --no-cache build-base cmake git linux-headers openssl-dev pkgconf >/dev/null
                     pip3 wheel --no-cache-dir --require-hashes --wheel-dir=/tmp/wheels -r /req/constraints.txt
                     ls /tmp/wheels'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: client
        run: pnpm run build
      - name: Self-hosted fonts check (no Google Fonts in the bundles)
        working-directory: client
        # Fails if a font CDN host appears anywhere in the built SPA / GFS /
        # dashboard assets, or a built @font-face URL is absolute, data: or
        # missing (docs/principles.md → "No third-party fetches").
        run: pnpm run fonts:check
      - name: Typecheck
        working-directory: client
        run: pnpm run typecheck
      - name: Lint (ESLint)
        working-directory: client
        run: pnpm run lint
      - name: Circular import check (madge)
        working-directory: client
        # Circular imports break module execution order under bundlers
        # (esp. Vite/Rolldown in prod) — guard against re-introducing any.
        run: pnpm run lint:circular
      - name: i18n key check (§30.5)
        working-directory: client
        run: pnpm run i18n:check
      - name: Vitest
        working-directory: client
        run: pnpm run test

  haos-ingress-ui:
    # The built SPA driven end-to-end in Chrome behind a simulated Home
    # Assistant ingress (SH_MODE=haos): fake Supervisor + Core, an
    # ingress look-alike proxy under /api/hassio_ingress/<token>/, the
    # real backend. Fails when any request, WebSocket or navigation
    # escapes the ingress prefix, when the haos setup hands out a token,
    # or when ingress auth / the iframe embed / the 401 screen break.
    # Runs on every PR rather than path-filtered: the prefix can break
    # from backend changes too (auth middleware, SpaIndexView, the
    # platform adapter), and a path-filtered job that is later made
    # required would block every PR it skipped. See
    # .claude/skills/haos-ingress-ui/SKILL.md and docs/testing.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the backend (exactly the locked runtime set)
        run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Build the SPA
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - name: Ingress checks (harness.py verify)
        # Chrome is the runner's preinstalled Google Chrome — puppeteer-core
        # drives it over CDP, no browser download. ``--build=never``: the
        # step above just built the bundle.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          .venv/bin/python .claude/skills/haos-ingress-ui/harness.py verify \
            --build=never --out "$RUNNER_TEMP/haos-ingress-ui"
      - name: Upload report + screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: haos-ingress-ui-report
          path: ${{ runner.temp }}/haos-ingress-ui
          retention-days: 14
          if-no-files-found: ignore

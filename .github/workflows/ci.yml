name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run tests with branch coverage
        # §27.5 — branch coverage gate. Default ``--cov-precision=0``
        # means the displayed rounded percent is what the gate compares
        # against; locally the precise figure is ~89.84% (rounds to 90).
        # This PR added six test files covering the previously-lowest-
        # covered modules: profile / comment / space-member-profile
        # federation outbound (~58–74% → 100%), peer_directory_service
        # (70% → 100%), household_features_service (69% → 99%),
        # space_crypto_service (76% → 100%), and the
        # federation_inbound/space_membership defensive paths
        # (77% → 99%). Total precise coverage rose from 89.71% → 89.84%.
        # Ratchet the integer gate upward as more modules get covered;
        # never lower this number — add missing tests instead.
        #
        # ``pytest-xdist`` parallelism comes from
        # ``[tool.pytest.ini_options].addopts = "-n auto"`` in
        # ``pyproject.toml`` — runs across every available runner core
        # without an extra CLI flag here. ``coverage`` is already
        # ``parallel = true`` in ``[tool.coverage.run]`` so the
        # per-worker ``.coverage.*`` files merge cleanly when
        # ``pytest-cov`` finalises.
        #
        # ``--durations=25`` prints the slowest tests every run, so a new
        # test that waits out a real timeout shows up in review instead of
        # quietly adding minutes (see docs/testing.md, "Keeping the suite
        # fast").
        run: |
          pytest --cov=socialhome --cov-branch --cov-fail-under=90 --tb=short -q --durations=25

      - name: Run protocol/security tests (release blocker)
        run: |
          pytest tests/protocol/ -m security --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Pinned, NOT ``pip install ruff``. ruff's default rule set grows
      # between minors, so an unpinned install silently re-lints the
      # whole tree against whatever released most recently: 0.16 turned
      # a green ``main`` into 2779 findings and failed every open PR
      # without a line of code changing. ``.pre-commit-config.yaml``'s
      # ``ruff-pre-commit`` rev is the source of truth — keep this, that
      # rev, and pyproject's ``[dev]`` floor in lockstep.
      - run: pip install ruff==0.15.11
      - name: ruff check
        run: ruff check socialhome/ tests/
      - name: ruff format
        run: ruff format --check socialhome/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: mypy
        run: mypy socialhome/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: client
        run: pnpm run build
      - name: Typecheck
        working-directory: client
        run: pnpm run typecheck
      - name: Lint (ESLint)
        working-directory: client
        run: pnpm run lint
      - name: Circular import check (madge)
        working-directory: client
        # Circular imports break module execution order under bundlers
        # (esp. Vite/Rolldown in prod) — guard against re-introducing any.
        run: pnpm run lint:circular
      - name: i18n key check (§30.5)
        working-directory: client
        run: pnpm run i18n:check
      - name: Vitest
        working-directory: client
        run: pnpm run test

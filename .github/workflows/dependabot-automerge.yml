# Auto-merge Dependabot's patch + minor version updates.
#
# This only *enables* GitHub's auto-merge on the PR (``gh pr merge --auto``);
# GitHub merges it once every required status check on ``main`` has passed,
# and never if one fails. Major updates are left for a human review.
#
# ``pull_request`` (not ``pull_request_target``): the workflow runs from the
# PR's own commit, but Dependabot PRs only ever change dependency manifests,
# and the job is skipped for every other author. A Dependabot-triggered run
# gets a read-only token unless ``permissions`` grants more — here exactly
# what ``gh pr merge --auto`` needs, and only to this job.
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update's metadata
        id: metadata
        # v3.1.0 (2026-04-20), pinned by commit.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
      - name: Enable auto-merge (patch / minor only)
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

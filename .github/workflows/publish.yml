name: Publish

# Fire only when a GitHub release is published. Releases are the
# single canonical entry point — ``gh release create 2026.5.10 --target main``
# (or the web UI) creates the underlying CalVer tag AND fires
# ``release.published`` exactly once. A bare ``git tag && git push``
# no longer publishes; operators must go through the release UI / CLI.
#
# Reason for the rename from "dual trigger": pushing a tag manually
# also fires ``release.published`` when the auto-create-release step
# runs, so the old dual ``push.tags`` + ``release.published`` config
# ran the whole pipeline twice on every release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Build wheel + sdist (SPA bundled in) ──────────────────────────────
  # One artefact, three downstream consumers (PyPI publish + both Docker
  # images). The frontend is built here on amd64 — node and pnpm never
  # reach the multi-arch matrix, so the docker jobs don't pay a 5–10×
  # QEMU tax to install npm. Hatchling picks up ``socialhome/static/**``
  # via the ``artifacts`` rule in ``pyproject.toml``.
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags + history; the default
          # shallow clone (depth 1, no tags) can't resolve the release tag.
          # Full history makes the vcs version correct.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"
      # The docker jobs below export ``uv.lock`` at build time and install
      # exactly that set, and the Home Assistant App fetches ``uv.lock`` +
      # ``pyproject.toml`` for this exact tag from
      # ``raw.githubusercontent.com/social-home-io/socialhome/<tag>/…`` and
      # exports it the same way — the committed lock at the tag IS the
      # published lock, so no release asset is needed. Refuse to release a
      # tag whose lock is stale.
      - name: Dependency lock is up to date
        run: scripts/lock.sh --check
      - name: Build SPA + GFS bundles
        run: |
          pnpm --dir client install --frozen-lockfile
          pnpm --dir client run build
      - name: Build wheel + sdist
        # Pin the version to the exact release tag. The "Build SPA + GFS
        # bundles" step above rewrites tracked files under
        # ``socialhome/global_server/static/``, which dirties the git tree —
        # hatch-vcs would then bump to a ``.dev0+g<sha>.d<date>`` local version
        # that PyPI rejects (HTTP 400). Pinning makes the published version the
        # tag regardless of tree state. Empty on workflow_dispatch → falls back
        # to vcs (with no-local-version from pyproject).
        # NB: the bare ``SETUPTOOLS_SCM_PRETEND_VERSION`` — NOT the
        # ``_FOR_SOCIALHOME`` variant, which hatch-vcs ignores (it doesn't pass
        # ``dist_name`` through to setuptools_scm, so the per-project lookup
        # never matches). Verified locally: bare var → exact tag on a dirty
        # tree; the _FOR_ variant fell through to the dev version.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.release.tag_name }}
        run: |
          pip install build
          python -m build
      # Capture the wheel filename so the docker jobs can reference it
      # via ``--build-arg WHEEL``. ``uv pip install`` validates the
      # filename against PEP 427 (it must be
      # ``{name}-{version}-{python}-{abi}-{platform}.whl``), so we
      # can't just rename to ``socialhome.whl``. ``socialhome`` is
      # pure-Python → ``python -m build`` produces exactly one wheel;
      # the guard fails the workflow loudly if a future change breaks
      # that assumption (e.g. someone introduces a C extension).
      - name: Capture wheel filename
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/socialhome-*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly 1 wheel in dist/, got ${#wheels[@]}: ${wheels[*]}" >&2
            exit 1
          fi
          echo "name=$(basename "${wheels[0]}")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
    outputs:
      wheel: ${{ steps.wheel.outputs.name }}

  # ── Python package → PyPI via trusted publisher (OIDC) ──────────────────
  pypi:
    name: Publish socialhome to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Job-level permissions REPLACE the workflow-level block entirely
    # (everything not listed defaults to ``none``). ``contents: read``
    # keeps ``actions/checkout`` working on private repos and is safer
    # to keep explicit on public ones too.
    permissions:
      id-token: write          # OIDC — no API token needed
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publisher — configure at pypi.org/manage/account/publishing/
        # Project: socialhome, Workflow: publish.yml, Environment: pypi

  # ── Docker core image → GHCR ────────────────────────────────────────────
  docker-core:
    name: Build & push core Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # CalVer (YYYY.M.D[.N]) image tags. ``docker/metadata-action`` runs
      # the regexes below against ``github.ref_name`` and emits one
      # tag per match, so a single ``2026.5.10`` push gets:
      #   :2026.5.10  — pinned, immutable
      #   :2026.5     — minor track (rolling within the month)
      #   :2026       — major track (rolling within the year)
      #   :latest     — current stable
      # The pinned pattern includes the OPTIONAL same-day ``.N`` segment
      # (group=0 = the whole match), so a second release on a day —
      # ``2026.5.10.1`` — pins ``:2026.5.10.1`` instead of dropping the ``.1``
      # and overwriting ``:2026.5.10``. (The month/year tracks already
      # collapse the 4th segment correctly.)
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/social-home-io/socialhome
          tags: |
            type=match,pattern=\d+\.\d+\.\d+(\.\d+)?,group=0
            type=match,pattern=(\d+\.\d+)\.\d+,group=1
            type=match,pattern=(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WHEEL=${{ needs.build.outputs.wheel }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Docker GFS image → GHCR ─────────────────────────────────────────────
  # Separate job so a failure in the GFS build doesn't block the core push.
  docker-gfs:
    name: Build & push GFS Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same CalVer fan-out as ``docker-core`` — see comments there (incl.
      # the 4-part ``.N`` same-day pinned tag).
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/social-home-io/gfs
          tags: |
            type=match,pattern=\d+\.\d+\.\d+(\.\d+)?,group=0
            type=match,pattern=(\d+\.\d+)\.\d+,group=1
            type=match,pattern=(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gfs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WHEEL=${{ needs.build.outputs.wheel }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

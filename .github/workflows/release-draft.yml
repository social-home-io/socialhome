name: Release — draft

# Entry points for cutting a release.
#
#  * ``push: branches: [main]`` — every merge to main auto-refreshes
#    the draft for today's CalVer date. Each run first deletes EVERY
#    open draft release (a draft is by contract the auto-generated
#    view — a hand-polished one should have been published), then
#    recreates today's so the notes always reflect the latest merged
#    set AND no stale draft from an earlier, never-published day can
#    accumulate. No tag is created until the operator clicks
#    **Publish release**, so a refresh cycle costs nothing.
#  * ``workflow_dispatch`` — manual override. Same logic, plus an
#    optional ``date`` input for back-dating a draft (e.g. cutting a
#    release for yesterday's merges if the auto-run was missed).
#
# Publishing the draft (in the GitHub UI or via ``gh release edit
# <tag> --draft=false``) is what creates the underlying CalVer tag
# AND fires ``release.published``, which is the single trigger for
# ``publish.yml`` (PyPI + Docker images). Drafts do not create tags
# and do not trigger ``publish.yml`` — so this workflow is safe to
# re-run any number of times per day.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release date (YYYY-MM-DD). Defaults to today UTC."
        required: false
        type: string
  push:
    branches: [main]

# Multiple PR merges within seconds of each other would otherwise
# race two draft-creation runs against the same version. Group by
# the branch so the latest run wins; cancel any in-flight refresh.
concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # creating a draft release needs write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next CalVer tag
        id: ver
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          d="${INPUT_DATE:-$(date -u +%Y-%m-%d)}"
          y=$(date -d "$d" +%Y)
          m=$(date -d "$d" +%-m)   # %-m / %-d strip leading zeros so we get
          day=$(date -d "$d" +%-d) # 2026.5.13 not 2026.05.13
          base="${y}.${m}.${day}"
          existing=$(git tag -l "${base}" "${base}.*" | sort -V || true)
          if [ -z "$existing" ]; then
            version="$base"
          else
            highest=$(echo "$existing" | tail -n 1)
            if [ "$highest" = "$base" ]; then
              version="${base}.1"
            else
              n="${highest##*.}"
              version="${base}.$((n + 1))"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "## Computed version: \`$version\`"
            echo
            echo "### Existing same-day tags"
            if [ -z "$existing" ]; then
              echo "_(none — this is the first release of the day)_"
            else
              echo '```'
              echo "$existing"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Anchor the auto-generated diff to the most recent published
          # release. ``gh release view`` with no arg returns the latest
          # non-draft release, so this stays correct even after a CalVer
          # rollover where lexical tag sorting would otherwise misorder
          # ``2026.5.13`` vs ``2026.5.9``.
          prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)

          # Delete EVERY open draft release before recreating today's.
          # Deleting only the draft whose name == "$VERSION" (the old
          # behaviour) left a previous day's draft orphaned whenever the
          # date rolled over without a publish — drafts then piled up
          # indefinitely. A draft is by contract the auto-generated view
          # (a hand-polished one should have been published), so sweeping
          # them all keeps exactly one draft open and self-heals any
          # backlog. ``--generate-notes`` rebuilds the body
          # deterministically from merged PRs, so nothing hand-typed is
          # at risk. Target by release *id*, never tag name: a leftover
          # draft can share a tag with an already-published release, and
          # ``gh release delete <tag>`` could remove the published one.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft) | .id' \
          | while read -r id; do
              [ -n "$id" ] || continue
              echo "Deleting stale draft release id=$id"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            done

          args=(
            "$VERSION"
            --target main
            --title "$VERSION"
            --generate-notes
            --draft
          )
          if [ -n "$prev" ]; then
            args+=(--notes-start-tag "$prev")
          fi
          gh release create "${args[@]}"
          url=$(gh release view "$VERSION" --json url -q .url)
          {
            echo
            echo "### Draft release"
            echo "Ready to review: $url"
            echo
            echo "Polish the notes in the UI, then click **Publish release**."
            echo "That's what creates the \`$VERSION\` tag and fires \`release.published\` — \`publish.yml\` picks it up from there."
          } >> "$GITHUB_STEP_SUMMARY"

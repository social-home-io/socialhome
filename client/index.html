<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Document base URL — rewritten by the backend's ``SpaIndexView``
    (``socialhome/routes/spa.py``) when the request arrives behind
    HA Supervisor's ingress proxy. The backend substitutes the
    ``href`` with the ingress prefix (e.g.
    ``/api/hassio_ingress/<token>/``) so the SPA's relative
    fetch / WebSocket / navigation URLs resolve against the
    correct document base. The fallback ``/`` is what every
    non-ingress deployment sees.
  -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <!-- Theme colours match tokens.css: paper (light) / paper-deep dark (dark). -->
  <meta name="theme-color" content="#F4ECE0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161821" media="(prefers-color-scheme: dark)" />
  <!--
    Preload the body font's latin subset so the first paint uses Manrope
    instead of swapping in from the fallback. Fonts are bundled
    (src/styles/fonts.css) — never fetched from a font CDN. Vite rewrites
    this to the fingerprinted ``./assets/…woff2``, a relative URL that
    resolves against ``<base href>`` (ingress-safe). ``crossorigin`` is
    required: font loads are CORS-mode, so a preload without it would be
    fetched twice.
  -->
  <link rel="preload" href="/src/assets/fonts/manrope/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Relative href so the browser resolves it against ``<base href>`` — under
       HA Supervisor ingress the manifest comes from
       ``/api/hassio_ingress/<token>/manifest.json`` rather than HA Core's
       ``/manifest.json``. ``start_url`` / ``scope`` inside the manifest are
       likewise relative, so they pick up the same ingress prefix. -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Social Home</title>
  <!--
    Pre-paint theme bootstrap (public/assets/theme-boot.js). A classic,
    synchronous script so the `<html>` class matches the stored or system
    theme on the very first paint — no light→dark flash on reload. It is a
    file, not inline: the Content-Security-Policy (socialhome/csp.py) is
    `script-src 'self'` with no 'unsafe-inline', and
    tests/routes/test_spa.py fails on any inline
    <script>. Relative src so it resolves against <base href> (ingress).
  -->
  <script src="assets/theme-boot.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

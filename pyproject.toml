[project]
name = "socialhome"
dynamic = ["version"]
requires-python = ">=3.14"
license = {text = "Mozilla Public License 2.0"}
license-files = ["LICENSE"]
# Every direct dependency (here and in every optional-dependencies group)
# is pinned to an EXACT version so the wheel, the Docker images, CI and dev
# envs all install the same tested set — Social Home is an application,
# not a library, so nobody co-installs it with conflicting pins. Dependabot
# proposes new versions weekly, 3 days after their release (patch/minor
# auto-merge on green CI, majors are reviewed); a hand bump goes through a
# PR too (docs/testing.md, "Dependency updates"). Transitive dependencies
# are locked too: ``uv.lock`` pins every package; the Docker images and the
# Home Assistant App export it (versions + hashes) with ``uv export
# --frozen`` at build time. After editing a pin here, run
# ``scripts/lock.sh`` (see docs/testing.md, "Dependency lock").
dependencies = [
    "aiohttp==3.14.5",
    "aiosqlite==0.22.1",
    "orjson==3.13.0",
    "cryptography==50.0.2",
    "aiofiles==25.1.0",
    "pillow==12.3.0",
    # HEIC support — registers an ``Image.open`` handler for HEIC/HEIF
    # bytes so iPhone + modern-Android (Samsung One UI 6+, Pixel
    # HEIF-on) camera photos can be uploaded. Without this, the magic-
    # byte check accepts ``image/heic`` (it's in :data:`IMAGE_ACCEPTED_MIMES`)
    # but the ``Image.open`` call inside :class:`ImageProcessor` raises
    # ``cannot identify image file`` and the upload 422s.
    "pillow-heif==1.8.1",
    "av==19.0.2",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "icalendar==7.3.0",
    # WebRTC DataChannel transport (§4.2.3, §24.12). Primary SH-to-SH
    # transport — inbox is only the fallback for peers that can't
    # open a direct peer connection. Also mandatory for GFS relay
    # (§24). The PyPI distribution and import name are both
    # ``aiolibdatachannel`` — async-native bindings over libdatachannel.
    # 2026.5.10 is the resumption of the ``YYYY.M.D`` CalVer pattern
    # after a one-off mistake: 2026.9.5 was tagged on 2026-05-09 (the
    # date was meant to be 2026.5.9). 2026.9.5 has been yanked on PyPI;
    # a ``>=`` specifier resolves to a non-yanked candidate, while
    # 2026.9.5 itself remains reachable only via an explicit
    # ``==2026.9.5`` pin — never pin that one.
    # Per-Python-version wheels (cp312 / cp313 / cp314); pre-2026.5.10
    # ABI3 wheels segfaulted on first ``PeerConnection`` use under
    # CPython 3.14 (nanobind stable-ABI marshalling regression).
    # 2026.5.10 also includes the remote-candidate buffering fix that
    # eliminates spurious ``rtcAddRemoteCandidate: runtime failure
    # (-2)`` tracebacks during normal trickle-ICE flow.
    # 2026.5.22 fixes a hang in ``DataChannel.send(wait_for_drain=True)``
    # when the channel closes mid-wait — without this, a sender whose
    # buffer was above HWM at the moment the peer disconnected would
    # park on ``_buffered_low_event`` forever
    # (social-home-io/aiolibdatachannel#13).
    # 2026.9.8 releases the GIL while registering libdatachannel
    # callbacks (social-home-io/aiolibdatachannel#20). Registration
    # happens on the event-loop thread for every ``PeerConnection`` /
    # ``DataChannel`` we open, so holding the GIL across that FFI call
    # stalled every other coroutine for its duration — the same class of
    # "never block the loop" rule this project applies to its own code.
    # It also vendors libdatachannel v0.24.5
    # (social-home-io/aiolibdatachannel#21).
    "aiolibdatachannel==2026.10.15",
    # mDNS announcement of the household dashboard to wall panels
    # (``socialhome/dashboard/advertiser.py``). LGPL-2.1-or-later, used as
    # an unmodified, dynamically imported library — compatible with
    # MPL-2.0. Pure ``asyncio`` API; cp314 wheels on every arch we ship.
    "zeroconf==0.151.5",
    # Interface scan for the addresses the dashboard announces (also a
    # zeroconf dependency; declared because we import it directly). MIT.
    "ifaddr==0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-aiohttp==1.1.1",    # provides ``aiohttp_server`` / ``aiohttp_client`` fixtures
    "pytest-cov==7.1.0",
    # ``pytest-xdist`` runs the suite across all available CPU cores
    # via ``-n auto``. The default addopts in ``[tool.pytest.ini_options]``
    # opt in, so ``pytest tests/`` is parallel without extra flags —
    # CI and local runs share the same speed.
    "pytest-xdist==3.8.0",
    "aiohttp[speedups]==3.14.5",
    "freezegun==1.5.5",
    # Validates the wall-panel API payloads against their published JSON
    # Schemas (``docs/display-api/v1/``).
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "types-aiofiles==25.1.0.20260518",
    # Keep the pin identical to ``.pre-commit-config.yaml``'s
    # ``ruff-pre-commit`` rev and CI's ``pip install ruff==`` — ruff
    # format rules change between minors, so a dev env on a different
    # ruff prints "would reformat" for files the pre-commit hook just
    # accepted, and vice-versa; the LINT rule set grows between minors
    # too (0.17 widened the defaults with BLE001, RUF059, TRY004, ...), so
    # a newer ruff reports findings the pinned hook and CI don't gate on.
    # We run ruff's default rules with no select/ignore: a bump fixes the
    # codebase, never pins the old rule set. Bump all three together.
    "ruff==0.17.1",
    "pre-commit==4.7.0",
    # Pulled in so ``tests/global_server/*`` can import the GFS admin
    # modules without a separate ``pip install .[global-server]`` step.
    # Keep these two pins identical to the ``global-server`` group below.
    "bcrypt==5.0.0",
    "qrcode[pil]==8.2",
]
# Global Federation Server (GFS) runtime deps — pulled by the
# `socialhome-global-server` console script.
# Install with: pip install 'socialhome[global-server]'
global-server = [
    "bcrypt==5.0.0",        # admin password hashing (spec §24.9)
    "qrcode[pil]==8.2",     # public-landing QR code rendering
]

[project.scripts]
socialhome-global-server = "socialhome.global_server.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# CalVer versioning driven by git tags — ``YYYY.M.D`` tags
# (``2026.5.11``, ``2026.5.11.1`` for same-day re-releases). The
# build reads the latest tag, hatch-vcs writes it into
# ``socialhome/_version.py`` (gitignored), and ``__version__`` in
# ``socialhome/__init__.py`` imports from there. No more manual
# ``version = "..."`` bump in this file before each release.
[tool.hatch.version]
source = "vcs"
# Never emit a PEP 440 *local* version segment (``+g<sha>.d<date>``). PyPI
# rejects local versions outright (HTTP 400), so a build off a non-tag commit
# or a dirty tree (e.g. the release job rebuilds the SPA into tracked GFS
# static, dirtying the tree) would otherwise produce an unpublishable wheel
# like ``2026.6.6.dev0+g531e19e11.d20260605``. The release workflow pins the
# exact tag via ``SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SOCIALHOME``; this is the
# belt-and-suspenders for the workflow_dispatch / fallback path.
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "socialhome/_version.py"

[tool.hatch.build]
# ``socialhome/static/`` is gitignored — it's the SPA bundle, built
# per release from ``client/`` (``pnpm run build``). Hatchling
# defaults to skipping VCS-ignored files, which would ship a wheel
# without the SPA. ``artifacts`` is the documented escape hatch for
# "include this regardless of .gitignore". The build pipeline
# (``.github/workflows/publish.yml``) runs ``pnpm --dir client run
# build`` before ``python -m build`` so the bundle is on disk by
# the time hatchling packages the wheel.
#
# Setting this at the top-level ``[tool.hatch.build]`` (not
# ``[tool.hatch.build.targets.wheel]``) covers both the wheel and the
# sdist. ``python -m build`` defaults to building the sdist first and
# then the wheel from that sdist — if the sdist drops the artifact,
# the wheel-from-sdist build has nothing to include and the SPA
# ships empty (which happened on the 2026.5.10 / 2026.5.11 releases).
#
# ``socialhome/global_server/static/`` mixes vite outputs (``admin.*``,
# ``{highlight,moment}_public_viewer.js``, the shared ``*.module-*.js`` chunks) with
# handcrafted SSR assets (``avatar_placeholder.svg``,
# ``users_directory.{css,js}``). The vite outputs are gitignored
# alongside the SPA (per ``.gitignore``) so the wheel needs explicit
# artifacts entries for each; the handcrafted files stay tracked and
# hatchling picks them up without an override.
artifacts = [
    "socialhome/static/**/*",
    "socialhome/global_server/static/admin.css",
    "socialhome/global_server/static/admin.js",
    "socialhome/global_server/static/highlight_public_viewer.js",
    "socialhome/global_server/static/moment_public_viewer.js",
    # vite factors the shared Preact runtime into a separate chunk that
    # every entry bundle imports; its representative-module name drifts
    # across vite/preset upgrades (hooks → jsxRuntime → …), so glob the
    # whole ``*.module-*.js`` family rather than a single hardcoded name.
    # Missing it ships an entry bundle without the chunk it imports → the
    # browser 404s on the import and the SPA renders blank.
    "socialhome/global_server/static/*.module-*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ``-n auto`` (pytest-xdist) shards the suite across every available
# CPU core. Tests are written for in-memory ``tmp_path`` fixtures and
# fresh ``aiohttp`` clients per test, so they don't share mutable
# state — parallel-safe by construction. ``--dist=loadfile`` keeps
# tests from the same file on the same worker, which avoids the
# rare case where a module-level fixture isn't reset between runs.
# Disable with ``-p no:xdist`` for noisier output during debugging.
addopts = "-n auto --dist=loadfile"
# Every async fixture is function-scoped; say so rather than lean on
# pytest-asyncio's default (it warns that the default will change).
asyncio_default_fixture_loop_scope = "function"
# Any warning fails the run — an unclosed sqlite3 connection, a mock
# coroutine nobody awaited, an aiohttp deprecation. They were 498 lines of
# noise nobody read; as errors a new one is fixed in the PR that adds it.
# Add an exception only for a third-party warning that cannot be fixed
# here, narrowly (category + message + module) and with a reason.
filterwarnings = [
    "error",
    # aiohttp's client advises against posting a >1 MiB ``bytes`` body (it
    # is serialised on the event loop). The upload-limit tests post such
    # bodies on purpose — that is what they test — from a test client
    # whose loop blocking is irrelevant.
    "ignore:Sending a large body directly with raw bytes:ResourceWarning:aiohttp.payload",
]
markers = [
    "security: spec §27 release-blocker protocol/security test",
    "integration: real DB / real aiohttp client (§27.5)",
]

[tool.ruff.lint]
# ruff's default rules (see the ``ruff`` pin above), plus one banned API.
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# JSON is orjson everywhere; the bytes a signature or a hash covers go
# through ``socialhome.canonical_json`` — the one module allowed the stdlib
# ``json`` (orjson can't reproduce ``ensure_ascii`` or stdlib float forms).
"json".msg = "use orjson; signed or hashed JSON bytes go through socialhome.canonical_json"

[tool.ruff.lint.per-file-ignores]
"socialhome/canonical_json.py" = ["TID251"]
# Migrations are frozen history: they keep the code they shipped with.
"socialhome/migrations/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.coverage.run]
branch = true
source = ["socialhome"]
parallel = true

[tool.coverage.report]
fail_under = 90

[tool.mypy]
python_version = "3.14"
# We opt out of full ``strict = true`` — the noisy checks (type-arg,
# no-untyped-def on inner helpers, no-untyped-call) add hundreds of
# annotations without catching real bugs. We keep the checks that
# DO catch bugs: assignment mismatches, arg-type conflicts,
# call-overload issues, return-value correctness, union-attr access.
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_decorators = false
no_implicit_optional = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = true
files = ["socialhome"]
# Tests use looser typing — fakes/mocks frequently disagree with
# Protocols. Run mypy on production code only.
exclude = '(^tests/|^client/)'


[[tool.mypy.overrides]]
# liboqs-python is shipped as an optional extra (pq). Deployments on
# the classical sig_suite never import it, so mypy's missing-stubs
# warning for ``oqs`` is a red herring.
module = ["oqs", "oqs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pywebpush ships no type stubs.
module = ["pywebpush", "pywebpush.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pillow_heif ships no py.typed marker. The image processor's
# ``# type: ignore[import-untyped]`` worked on the contributor's
# local mypy build, but on a fresh venv mypy raises the
# ``import-not-found`` code instead — the suppression doesn't
# match, the hook fails. The override covers both shapes.
module = ["pillow_heif", "pillow_heif.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# orjson has no stubs in older releases.
module = ["orjson"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyAV C bindings have no type stubs; the video_processor module
# uses PyAV's untyped union-return APIs extensively.
module = ["av", "av.*", "socialhome.media.video_processor"]
ignore_missing_imports = true
disable_error_code = ["union-attr", "attr-defined", "arg-type"]

[tool.uv]
# ``uv.lock`` is a universal resolution (every OS / arch / Python >= 3.14).
# ``required-environments`` makes ``uv lock`` fail if any locked package has
# no wheel for the Linux arches we ship: x86_64 + aarch64 (glibc). Markers
# can't tell glibc from musl, so the Alpine-based Home Assistant App is
# covered by CI's ``images`` job (hash-checked ``pip3 wheel`` on the App's
# musl base image, amd64 + aarch64) — today every runtime package ships a
# musllinux cp314 wheel except ``aiolibdatachannel``, which the App's
# builder stage compiles from the locked (hashed) sdist.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
